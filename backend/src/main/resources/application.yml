server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: readwise-ai
  
  # Database Configuration (PostgreSQL Production Ready, H2 Fallback)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readwisedb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Tanu@2025}
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Application Custom Security & JWT Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000}

  # External API Integrations
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    model: gemini-flash-latest
    base-url: https://generativelanguage.googleapis.com/v1beta

  news:
    api-key: ${NEWS_API_KEY:demo-key}
    base-url: https://newsapi.org/v2

logging:
  level:
    root: INFO
    com.readwise.ai: DEBUG
    org.springframework.security: INFO
